<!DOCTYPE html>
<html lang="fr-BE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les amortissements — Partie 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0e17; --bg2:#141927; --bg3:#0f1320; --card:#171d2e; --card2:#1d2438;
  --accent:#22d68a; --accent2:#18b574; --orange:#ff8a3d; --gold:#ffd166; --violet:#8b7bff; --cyan:#3fc8ff;
  --text:#eef1f8; --text2:#a3abc2; --text3:#6b7391; --border:#2a3250;
  --radius:16px; --success:#22d68a; --error:#ff4d6d;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(circle at 15% -10%,rgba(139,123,255,.18),transparent 45%),radial-gradient(circle at 100% 20%,rgba(34,214,138,.12),transparent 40%);background-attachment:fixed}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
b,strong{font-weight:700}

/* ===== HUD ===== */
.hud{position:sticky;top:0;z-index:100;background:rgba(11,14,23,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hud-row{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.logo{font-size:1.6rem;filter:drop-shadow(0 0 8px rgba(34,214,138,.5))}
.app-title{font-weight:800;font-size:1.05rem;letter-spacing:.3px}
.app-title small{display:block;font-weight:400;font-size:.72rem;color:var(--text2);letter-spacing:.5px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.mono{font-family:'Space Mono',monospace;font-weight:400;color:var(--text2)}
.chip.streak.hot{border-color:var(--orange);color:var(--orange);animation:pulse 1s infinite}
.icon-btn{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;width:36px;height:34px;font-size:1rem}
.icon-btn:hover{border-color:var(--accent)}
.xpwrap{max-width:980px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:10px}
.rank{font-weight:800;font-size:.85rem;white-space:nowrap}
.xpbar{position:relative;flex:1;height:12px;background:var(--bg3);border:1px solid var(--border);border-radius:999px;overflow:visible}
.xpfill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--cyan));box-shadow:0 0 12px rgba(34,214,138,.6);transition:width .6s cubic-bezier(.2,.9,.3,1.2)}
.xpmark{position:absolute;top:-3px;width:2px;height:16px;background:var(--gold);opacity:.7;border-radius:2px}
.xpmark span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.7rem}
.xpnext{font-size:.72rem;color:var(--text2);white-space:nowrap}
.pills{max-width:980px;margin:0 auto;padding:0 16px 10px;display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--border);background:var(--bg2);color:var(--text2);border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600}
.pill.done{border-color:var(--accent);color:var(--accent)}
.pill.cur{border-color:var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(255,209,102,.3)}
.pill.locked{opacity:.4;cursor:not-allowed}

/* ===== Layout ===== */
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.btn{border:none;border-radius:12px;padding:12px 22px;font-weight:800;font-size:1rem;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06130d;box-shadow:0 6px 18px rgba(34,214,138,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(34,214,138,.45)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent)}
.btn.orange{background:linear-gradient(135deg,var(--orange),#f36b1c);color:#1b0b00;box-shadow:0 6px 18px rgba(255,138,61,.3)}
.btn.sm{padding:8px 14px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.muted{color:var(--text2)}
h1{font-size:2.3rem;font-weight:900;line-height:1.1}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:800}
.grad{background:linear-gradient(90deg,var(--accent),var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ===== Welcome ===== */
.hero{text-align:center;padding:30px 10px 10px}
.hero .big{font-size:4rem;display:block;margin-bottom:6px;animation:float 3s ease-in-out infinite}
.hero p.lead{max-width:620px;margin:14px auto 0;color:var(--text2);font-size:1.05rem}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:26px 0}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:1.5rem;font-weight:900}
.stat span{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.6px}
.who{display:inline-flex;gap:8px;align-items:center;background:rgba(34,214,138,.08);border:1px solid rgba(34,214,138,.3);padding:6px 14px;border-radius:999px;font-size:.85rem;margin-top:10px}
.lbbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.lbbtn{padding:10px 20px;border-radius:10px;font-weight:700;background:transparent}
.lbbtn.app{border:1px solid var(--accent);color:var(--accent)} .lbbtn.app:hover{background:var(--accent);color:#06130d}
.lbbtn.glob{border:1px solid var(--orange);color:var(--orange)} .lbbtn.glob:hover{background:var(--orange);color:#1b0b00}

/* ===== Hub path ===== */
.path{position:relative;margin:26px 0 10px;padding:10px 0}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--border);transform:translateX(-50%)}
.step{position:relative;display:flex;align-items:center;margin:18px 0;min-height:110px}
.node{position:absolute;left:50%;transform:translateX(-50%);width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;background:var(--bg2);border:3px solid var(--border);z-index:2}
.node.done{background:var(--accent);border-color:var(--accent);color:#06130d}
.node.todo{border-color:var(--gold);color:var(--gold);animation:glow 1.6s infinite}
.node.locked{opacity:.6}
.lvcard{width:calc(50% - 50px);cursor:pointer;transition:transform .2s,border-color .2s}
.lvcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.lvcard.locked{cursor:not-allowed;opacity:.5}
.lvcard.locked:hover{transform:none;border-color:var(--border)}
.step.right{justify-content:flex-end}
.lvcard .ic{font-size:2rem}
.lvcard .stars{color:var(--gold);letter-spacing:2px}
.lvmeta{display:flex;justify-content:space-between;margin-top:8px;font-size:.82rem;color:var(--text2)}
.trophies{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.trophy{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.trophy .ti{font-size:1.9rem}
.trophy.off{opacity:.38;filter:grayscale(1)}
.trophy b{display:block;font-size:.88rem;margin-top:4px}
.trophy small{color:var(--text2);font-size:.72rem;display:block;line-height:1.3}

/* ===== Brief ===== */
.brief-head{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.brief-head .ic{font-size:3rem}
.tagline{color:var(--text2);font-size:.9rem}
.objectives{background:rgba(139,123,255,.08);border:1px solid rgba(139,123,255,.35);border-radius:14px;padding:14px 18px;margin:14px 0}
.objectives li{margin-left:20px;margin-top:4px}
.theory{margin:14px 0;font-size:1rem}
.theory ul{margin:8px 0 0 20px}
.theory li{margin:5px 0}
.formula{display:inline-block;font-family:'Space Mono',monospace;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:1px 8px;font-size:.9rem}
.box{border-radius:14px;padding:12px 16px;margin:12px 0;font-size:.95rem}
.box.ex{background:rgba(255,138,61,.08);border:1px solid rgba(255,138,61,.4)}
.box.plus{background:rgba(255,209,102,.07);border:1px dashed rgba(255,209,102,.5)}
.box .bt{font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.box.ex .bt{color:var(--orange)} .box.plus .bt{color:var(--gold)}
.figure{display:flex;justify-content:center;margin:10px 0}
.predict{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.predict button{flex:1;min-width:150px;padding:12px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-weight:700}
.predict button.sel{border-color:var(--gold);background:rgba(255,209,102,.12);color:var(--gold)}

/* ===== Questions ===== */
.qdots{display:flex;gap:6px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.qdot{width:26px;height:8px;border-radius:99px;background:var(--border)}
.qdot.correct{background:var(--success)} .qdot.hint{background:var(--orange)} .qdot.shown{background:var(--error)}
.qdot.cur{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.qtag{font-size:.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--text3);font-weight:700}
.qhead{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.qtitle{font-size:.85rem;font-weight:800;color:var(--violet);margin-top:4px}
.qtext{font-size:1.1rem;font-weight:600;margin:8px 0 12px}
.data{display:block;background:var(--bg3);border:1px solid var(--border);border-left:4px solid var(--cyan);border-radius:10px;padding:10px 14px;margin:10px 0 16px;font-size:.95rem;line-height:1.7}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px 16px;border-radius:12px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:1rem;transition:border-color .15s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt:disabled{cursor:default}
.opt.wrong{border-color:var(--error);background:rgba(255,77,109,.1);opacity:.75}
.opt.right{border-color:var(--success);background:rgba(34,214,138,.12)}
.opt.missed{border:2px dashed var(--success)}
.opt.sel{border-color:var(--cyan);background:rgba(63,200,255,.1)}
.opt .box2{display:inline-block;width:18px;height:18px;border:2px solid var(--text3);border-radius:5px;margin-right:10px;vertical-align:-3px}
.opt.sel .box2{background:var(--cyan);border-color:var(--cyan)}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vf .opt{text-align:center;font-weight:800;font-size:1.15rem;padding:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.9rem;color:var(--text2);font-weight:600}
.inwrap{display:flex;align-items:center;gap:6px}
.inwrap input{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:'Space Mono',monospace;font-size:.95rem;text-align:right}
.inwrap input:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(63,200,255,.15)}
.inwrap em{font-style:normal;color:var(--text2);font-weight:700}
.lk{display:inline-block;padding:9px 12px;border-radius:10px;font-family:'Space Mono',monospace;font-size:.92rem;text-align:right;width:100%}
.lk.ok{background:rgba(34,214,138,.12);border:1px solid var(--success);color:var(--success)}
.lk.ok2{background:rgba(255,138,61,.12);border:1px solid var(--orange);color:var(--orange)}
.lk.ko{background:rgba(255,77,109,.1);border:1px solid var(--error);color:var(--error)}
.lk.ko s{opacity:.6}
.tablewrap{overflow-x:auto;margin:6px 0}
table.amt{width:100%;border-collapse:separate;border-spacing:0;font-size:.9rem;min-width:520px}
table.amt th{background:linear-gradient(135deg,#3a3180,#2a2560);color:#fff;padding:9px 8px;font-size:.8rem;text-align:center}
table.amt th:first-child{border-top-left-radius:10px} table.amt th:last-child{border-top-right-radius:10px}
table.amt td{padding:5px;border-bottom:1px solid var(--border);text-align:right}
table.amt td.yr{text-align:center;font-weight:800;color:var(--text2);width:60px}
table.amt td.given{font-family:'Space Mono',monospace;color:var(--text2);padding-right:12px}
table.amt .inwrap input{padding:8px;font-size:.85rem}
table.amt .lk{padding:8px;font-size:.85rem}
.calcprev{min-height:1.4em;font-family:'Space Mono',monospace;font-size:.85rem;color:var(--cyan);margin-top:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:12px;background:var(--bg3);border:1px dashed var(--border);border-radius:12px;margin-bottom:12px}
.pool .lbl{width:100%;font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.tag{padding:8px 12px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:.9rem;font-weight:600;transition:transform .15s}
.tag:hover{border-color:var(--cyan)}
.tag.sel{border-color:var(--gold);background:rgba(255,209,102,.15);transform:scale(1.04)}
.tag.ok{border-color:var(--success);background:rgba(34,214,138,.12);cursor:default}
.tag.ok2{border-color:var(--orange);background:rgba(255,138,61,.12);cursor:default}
.tag.ko{border-color:var(--error);background:rgba(255,77,109,.1);cursor:default}
.tag .fix{display:block;font-size:.75rem;color:var(--gold);font-weight:700}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.zone{min-height:140px;border:2px dashed var(--border);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s,background .15s}
.zone:hover{border-color:var(--cyan);background:rgba(63,200,255,.04)}
.zone h4{font-size:.85rem;text-transform:uppercase;letter-spacing:1px;color:var(--text2);text-align:center}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.mrow select{padding:9px;border-radius:9px;background:var(--bg3);color:var(--text);border:1px solid var(--border);font-family:inherit;font-size:.95rem}
.slots{display:grid;gap:8px;margin-bottom:12px}
.slot{display:flex;gap:10px;align-items:center;min-height:46px;padding:6px 10px;border:2px dashed var(--border);border-radius:12px;cursor:pointer}
.slot:hover{border-color:var(--cyan)}
.slot .n{width:28px;height:28px;border-radius:50%;background:var(--violet);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.slot .tag{flex:1}
.trous{font-size:1.05rem;line-height:2.4;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.blank{display:inline-block;min-width:110px;padding:2px 10px;margin:0 3px;border-bottom:2px solid var(--cyan);text-align:center;cursor:pointer;border-radius:6px 6px 0 0;background:rgba(63,200,255,.06);line-height:1.6}
.blank.ok{border-color:var(--success);color:var(--success);background:rgba(34,214,138,.1);cursor:default}
.blank.ok2{border-color:var(--orange);color:var(--orange);background:rgba(255,138,61,.1);cursor:default}
.blank.ko{border-color:var(--error);color:var(--error);background:rgba(255,77,109,.08);cursor:default}
.blank .fix{color:var(--gold);font-weight:700}
.doc{background:#f7f5ee;color:#1d2230;border-radius:12px;padding:16px 18px;font-size:.98rem;box-shadow:inset 0 0 0 1px #d8d2bf}
.doc h4{font-size:.95rem;margin-bottom:8px;color:#3a3180}
.line{display:block;width:100%;text-align:left;background:transparent;border:none;border-left:3px solid transparent;padding:7px 10px;margin:2px 0;border-radius:6px;color:#1d2230;font-size:.97rem}
.line:hover{background:rgba(58,49,128,.08)}
.line.sel{background:rgba(255,77,109,.14);border-left-color:#d6334f}
.line.ok{background:rgba(34,214,138,.18);border-left-color:#14915c;cursor:default}
.line.ok2{background:rgba(255,138,61,.2);border-left-color:#d86a1e;cursor:default}
.line.ko{background:rgba(255,77,109,.15);border-left-color:#d6334f;cursor:default}
.line .fix{display:block;font-size:.85rem;font-weight:700;color:#7a4b00}
.line.fa{text-decoration:line-through;opacity:.6}
.fb{margin-top:16px;border-radius:12px;padding:0;font-size:.97rem}
.fb:not(:empty){padding:12px 16px}
.fb.good{background:rgba(34,214,138,.1);border:1px solid rgba(34,214,138,.4)}
.fb.mid{background:rgba(255,138,61,.1);border:1px solid rgba(255,138,61,.4)}
.fb.bad{background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.4)}
.fb.info{background:rgba(63,200,255,.08);border:1px solid rgba(63,200,255,.35)}
.actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}

/* ===== Bilan ===== */
.medal{font-size:4.5rem;display:block;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.grade{display:inline-block;font-size:1.1rem;font-weight:900;padding:6px 16px;border-radius:999px;margin-top:8px}
.grade.A{background:rgba(34,214,138,.15);color:var(--accent)} .grade.B{background:rgba(63,200,255,.15);color:var(--cyan)}
.grade.C{background:rgba(255,138,61,.15);color:var(--orange)} .grade.D{background:rgba(255,77,109,.15);color:var(--error)}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:.85rem;color:var(--text2);margin:14px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.rtable{width:100%;border-collapse:collapse;margin-top:10px;font-size:.92rem}
.rtable th,.rtable td{padding:9px 6px;border-bottom:1px solid var(--border);text-align:center}
.rtable td:first-child,.rtable th:first-child{text-align:left}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.crit{border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px;background:var(--bg2)}
.crit-h{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800}
.st{font-size:.8rem;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.atteint{background:rgba(34,214,138,.15);color:var(--accent)}
.st.encours{background:rgba(255,138,61,.15);color:var(--orange)}
.st.nonatteint{background:rgba(255,77,109,.15);color:var(--error)}
.ind{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0 4px 10px;border-top:1px dashed var(--border);margin-top:8px;font-size:.92rem}
.revoir{font-size:.85rem;color:var(--gold);margin:2px 0 4px 10px}
.sim{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:center}
.sim input[type=range]{width:100%;accent-color:var(--accent)}

/* ===== Overlays & FX ===== */
.overlay{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:28px;max-width:440px;width:100%;text-align:center;animation:slideup .4s ease;position:relative}
.rankup .rays{position:absolute;width:700px;height:700px;background:repeating-conic-gradient(rgba(255,209,102,.13) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 14s linear infinite;pointer-events:none}
.rankup .modal{border-color:var(--gold);box-shadow:0 0 60px rgba(255,209,102,.35)}
.rankup .ri{font-size:5rem;display:block;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(150%);z-index:9500;background:linear-gradient(135deg,#2a2560,#171d2e);border:1px solid var(--gold);color:var(--text);padding:12px 20px;border-radius:14px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .45s cubic-bezier(.2,1.4,.4,1);max-width:92vw}
#toast.show{transform:translateX(-50%) translateY(0)}

<script>
/* =====================================================================
   1. OUTILS

const SP = /[\s  €%]/g;
function evalExpr(s) {
  let e = String(s).replace(SP,'').replace(/×/g,'*').replace(/÷/g,'/').replace(/,/g,'.');
  if (!/^[0-9+\-*/().]+$/.test(e) || !/[+\-*/]/.test(e.slice(1))) return null;
  try { const r = Function('"use strict";return (' + e + ')')(); return (typeof r === 'number' && isFinite(r)) ? r : null; }
  catch (err) { return null; }
}
function parseNum(s) {
  if (s === null || s === undefined) return NaN;
  const r = evalExpr(s); if (r !== null) return r;
  let t = String(s).replace(SP,'');
  if (t === '') return NaN;
  if (t.includes(',')) t = t.replace(/\./g,'').replace(',', '.');
  else if ((t.match(/\./g)||[]).length > 1) t = t.replace(/\./g,'');
  if (!/^-?\d*\.?\d+$/.test(t)) return NaN;
  return parseFloat(t);
}
function shuffled(n, seed) {
  const a = [...Array(n).keys()]; let s = seed;
  for (let i = n-1; i > 0; i--) { s = (s*9301 + 49297) % 233280; const j = Math.floor(s/233280*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch (e) {} };
const fmtE = n => n.toLocaleString('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN = n => n.toLocaleString('fr-BE',{maximumFractionDigits:2});
const fmtXP = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace('.',',');
function fmtAns(inp){ if(inp.u==='%') return fmtN(inp.a)+' %'; if(inp.u==='') return fmtN(inp.a); return fmtE(inp.a)+(inp.u==='€'?' €':''); }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* =====================================================================

const LEVELS = [
/* ---------------- MISSION 1 ---------------- */
{ id:'m1', icon:'🧱', title:"Les bases de l'amortissement", desc:"Biens amortissables, base, taux, annuité, cumul et VCN",
  theory:`<p>L'<b>amortissement</b> constate, à la fin de chaque exercice, la <b>perte de valeur définitive</b> d'une immobilisation (corporelle ou incorporelle) due à l'<b>usage</b>, au <b>temps</b> ou à l'<b>obsolescence</b>.</p>
  <ul>

   <li><b>Taux</b> : <span class="formula">t = 100 / N</span> (N = durée probable d'utilisation) · <b>Annuité</b> : <span class="formula">a = V₀ / N = V₀ × t</span></li>
   <li><b>Amortissements cumulés</b> = somme des annuités déjà actées · <b>VCN</b> = <span class="formula">valeur d'origine − amortissements cumulés</span></li>
  </ul>`,
  example:`Un entrepôt : prix 38 000 € HTVA + montage 2 000 € → base <b>40 000 €</b>. Durée 20 ans → taux 100 / 20 = <b>5 %</b> ; annuité 40 000 × 5 % = <b>2 000 €</b>. Après 2 ans : amortissements cumulés <b>4 000 €</b> ; VCN 40 000 − 4 000 = <b>36 000 €</b>.`,
  plus:`Les amortissements sont aussi un élément du <b>prix de revient</b> : sans eux, les livres comptables garderaient des valeurs surfaites, qui gonfleraient artificiellement les bénéfices.`,
  questions:[
  { type:'classement', ind:'I1',
    q:"Une boulangerie fait la liste de ses biens. Range chaque élément : s'amortit-il ou non ?",
    zones:["Amortissable","Non amortissable"],

{ id:'m2', icon:'📏', title:"Le plan linéaire du cours", desc:"Le plan de M. Durant et la chambre froide de TOUTESTBON",
  theory:`<p><b>Principe</b> : en linéaire, on répartit le coût en <b>parts égales</b> sur toute la durée d'utilisation.</p>
  <ul>
   <li><span class="formula">a = V₀ / N</span> ou <span class="formula">a = V₀ × t</span>, avec <span class="formula">t = 100 / N</span></li>
   <li>Le <b>plan d'amortissement</b> est un tableau qui constate les annuités successives et les valeurs comptables nettes.</li>
   <li>Chaque année : <span class="formula">nouvelle VCN = VCN précédente − annuité</span></li>
  </ul>`,
  figure:SVG_LIN,
  example:`Un photocopieur de 4 000 € amorti sur 8 ans : taux 100 / 8 = 12,5 % ; annuité 500 €. VCN fin année 1 : 3 500 € ; fin année 2 : 3 000 € ; et ainsi de suite.`,
  plus:`L'administration fiscale conseille des durées selon la nature du bien : par exemple 4 ou 5 ans pour le matériel de transport, souvent 10 ans pour le mobilier.`,

  { type:'vf', ind:'I5',

    expl:"<b>Vrai.</b> Le bien est entièrement amorti : la somme des N annuités est égale à la valeur d'origine (par exemple 4 × 2 500 = 10 000 €), il ne reste donc plus rien à amortir." },
  { type:'qcm', ind:'I4',
    q:"Dans un plan d'amortissement, la « valeur résiduelle » est aussi appelée…",
    options:[ "valeur comptable nette (VCN) : la valeur qui reste à amortir en fin d'exercice",

              "base amortissable : le coût d'acquisition du bien",

    hint:"Regarde la dernière colonne d'un plan : ce montant diminue chaque année jusqu'à zéro. Que représente-t-il ?",
    expl:"Valeur résiduelle = <b>valeur comptable nette (VCN)</b> = valeur nette comptable = valeur en fin d'exercice : c'est la valeur qui reste à amortir. L'annuité, elle, est constante ; la base ne change pas ; les cumulés augmentent." },
  { type:'fields', ind:'I3', title:"Exercice du cours : le plan de Monsieur Durant",

  { type:'fields', ind:'I5', title:"Exercice du cours : le plan de Monsieur Durant (suite)",

    data:"Valeur du bien : <b>25 000,00 €</b> · Durée : <b>5 ans</b> · Mise en service : <b>1er janvier N</b>",
    table:{ cols:["Année","Base d'amortissement","Annuité","Valeur résiduelle"],
      rows:[ ["1","25 000,00",{a:5000},{a:20000}], ["2","25 000,00",{a:5000},{a:15000}], ["3","25 000,00",{a:5000},{a:10000}],

    hint:"L'annuité change-t-elle d'une année à l'autre en linéaire ? Pour la valeur résiduelle, retire l'annuité à la valeur de l'année précédente.",

  { type:'fields', ind:'I4', title:"Exercice du cours : TOUTESTBON, fiche 3",

    data:"Nature : <b>installation – chambre froide</b> · Coût d'achat : <b>240 000,00 €</b> · Mise en service : <b>01-01-N</b> · Durée prévue : <b>10 ans</b> · Système : <b>linéaire</b>",
    head:[ {l:"Taux pratiqué",a:10,u:'%'}, {l:"Annuité",a:24000,u:'€'}, {l:"VCN fin année 3",a:168000,u:'€'}, {l:"VCN fin année 7",a:72000,u:'€'}, {l:"VCN fin année 10",a:0,u:'€'} ],

/* ----- Préparation : entrées numériques, points dérivés, rotation des QCM ----- */
const ELEMENT_PTS = 2;
LEVELS.forEach(lv => lv.questions.forEach(Q => {
  if (Q.type === 'fields') {
    Q.inputs = [];
    (Q.head||[]).forEach(f => Q.inputs.push({a:f.a, u:f.u===undefined?'€':f.u, tol:f.tol, l:f.l}));
    if (Q.table) Q.table.rows.forEach(r => r.forEach((c,j) => { if (typeof c === 'object') { c.k = Q.inputs.length; Q.inputs.push({a:c.a, u:'num€', tol:c.tol, l:Q.table.cols[j]+' année '+r[0]}); } }));
    Q.n = Q.inputs.length; Q.pts = Q.n * ELEMENT_PTS;
  }
  else if (Q.type === 'classement') { Q.n = Q.items.length; Q.pts = Q.n * ELEMENT_PTS; }
  else if (Q.type === 'appariement') { Q.n = Q.pairs.length; Q.pts = Q.n * ELEMENT_PTS; }
  else if (Q.type === 'ordre') { Q.n = Q.steps.length; Q.pts = Q.n * ELEMENT_PTS; }
  else if (Q.type === 'trous') { Q.n = Q.answers.length; Q.pts = Q.n * ELEMENT_PTS; }
  else if (Q.type === 'chasse') { Q.n = Q.lines.filter(l => l.err).length; Q.pts = Q.n * 3; }
  else if (Q.type === 'qcm') Q.pts = 6;
  else if (Q.type === 'multi') Q.pts = 6;
  else if (Q.type === 'vf') Q.pts = 4;
}));
/* fmtAns pour les cellules de tableau : montant sans symbole */
const _fmtAns = fmtAns;
fmtAns = function(inp){ if (inp.u === 'num€') return fmtE(inp.a); return _fmtAns(inp); };

const DECALAGE = [2,0,3,1, 1,3,0,2, 3,1,2,0, 0,2,1,3, 2,3,0,1];
(function melangerPropositions(liste){
  let k = 0;
  liste.forEach(q => {
    if (q.type !== 'qcm') return;
    const t = DECALAGE[k++ % DECALAGE.length];
    for (let n = 0; n < t; n++) { q.options.unshift(q.options.pop()); q.correct = (q.correct + 1) % q.options.length; }
  });
})(LEVELS.flatMap(lv => lv.questions));

LEVELS.forEach(lv => { lv.maxPoints = lv.questions.reduce((s,q) => s + q.pts, 0); });
const TOTAL_XP = LEVELS.reduce((s,lv) => s + lv.maxPoints, 0);
const TOTAL_Q  = LEVELS.reduce((s,lv) => s + lv.questions.length, 0);
const DUREE = { qcm:40, vf:20, multi:60, fields:90, classement:90, appariement:60, ordre:60, trous:90, chasse:120 };
function dureeQ(Q){ if (Q.type==='fields' && Q.table) return 60 + Q.n*10; return DUREE[Q.type]; }
const DUREE_MIN = Math.round((LEVELS.reduce((s,lv) => s + 60 + lv.questions.reduce((t,Q) => t + dureeQ(Q), 0), 0)) / 60);

const RANKS = [ {p:0,ic:'🎒',n:'Stagiaire'}, {p:.20,ic:'🧑‍💼',n:'Employé'}, {p:.45,ic:'🧮',n:'Chef comptable'}, {p:.65,ic:'📈',n:'Directeur financier'}, {p:.85,ic:'👑',n:'CEO'} ];
const TYPE_LABEL = { qcm:'QCM', vf:'Vrai / Faux', multi:'Sélection multiple', classement:'Classement', appariement:'Appariement', ordre:'Remise en ordre', trous:'Texte à trous', chasse:'Chasse aux erreurs' };

function levelStats(l){

  const n = lv.questions.length, first = c/n;
  return { c, h, s, n, pts, first };
}
const starsOf = r => r>=.85?'★★★':r>=.65?'★★☆':r>=.45?'★☆☆':'☆☆☆';
const gradeOf = r => r>=.85?['A','Excellent'] : r>=.65?['B','Très bien'] : r>=.45?['C','Satisfaisant'] : ['D','À retravailler'];

/* ----- Question ----- */
function renderQuestion(l,i){
  const lv = LEVELS[l], Q = getQ(l,i), st = S(l,i);
  const dots = lv.questions.map((q,j) => { const s = S(l,j); return `<span class="qdot ${j===i?'cur':(s.status||'')}"></span>`; }).join('');

  const tries = Q.type==='vf' ? '1 essai' : '2 essais';
  let body = '';
  switch (Q.type) {
    case 'qcm': body = rQCM(Q,st); break;
    case 'vf': body = rVF(Q,st); break;
    case 'multi': body = rMulti(Q,st,l,i); break;
    case 'fields': body = rFields(Q,st); break;
    case 'classement': body = rClassement(Q,st,l,i); break;
    case 'appariement': body = rApp(Q,st,l,i); break;
    case 'ordre': body = rOrdre(Q,st,l,i); break;
    case 'trous': body = rTrous(Q,st,l,i); break;
    case 'chasse': body = rChasse(Q,st); break;
  }
  const needVerify = !st.done && ['multi','fields','classement','appariement','ordre','trous','chasse'].includes(Q.type);
  const last = i === lv.questions.length-1;

}

/* QCM */
function rQCM(Q,st){
  return '<div class="opts">' + Q.options.map((o,j) => {
    let c = '';
    if (st.wrong.includes(j)) c = 'wrong';
    if (st.done && j === Q.correct) c = 'right';
    return `<button class="opt ${c}" ${st.done||st.wrong.includes(j)?'disabled':''} onclick="answerQCM(${j})">${o}</button>`;
  }).join('') + '</div>';
}
function answerQCM(j){
  const l = APP.level, i = APP.q, Q = getQ(l,i), st = S(l,i);
  if (st.done || st.wrong.includes(j)) return;
  if (j === Q.correct) {
    finishSimple(l,i, st.att===0 ? 'correct':'hint', st.att===0 ? Q.pts : Q.pts/2);
    st.fb = (st.att===0?'✅ Exact ! ':'✅ Corrigé au 2e essai. ') + Q.expl; st.fbc = st.att===0?'good':'mid';
  } else {
    st.wrong.push(j); st.att++;
    if (st.att === 1) { st.fb = '🤔 Pas tout à fait. 💡 ' + Q.hint; st.fbc = 'info'; wrongFx(); }
    else { finishSimple(l,i,'shown',0); st.fb = '👁 La bonne réponse est en vert. ' + Q.expl; st.fbc = 'bad'; wrongFx(); }
  }
  renderScreen();
}
/* Vrai / Faux */
function rVF(Q,st){
  return '<div class="vf">' + [true,false].map(v => {
    let c = '';
    if (st.done) { if (v === Q.answer) c = 'right'; else if (st.sel === v) c = 'wrong'; }
    return `<button class="opt ${c}" ${st.done?'disabled':''} onclick="answerVF(${v})">${v?'✔ Vrai':'✘ Faux'}</button>`;
  }).join('') + '</div>';
}
function answerVF(v){
  const l = APP.level, i = APP.q, Q = getQ(l,i), st = S(l,i);
  if (st.done) return; st.sel = v;
  if (v === Q.answer) { finishSimple(l,i,'correct',Q.pts); st.fb = '✅ ' + Q.expl; st.fbc = 'good'; }
  else { finishSimple(l,i,'shown',0); st.fb = '❌ ' + Q.expl; st.fbc = 'bad'; wrongFx(); }
  renderScreen();
}
/* Sélection multiple */
function rMulti(Q,st,l,i){
  if (!st.order) st.order = shuffled(Q.options.length, l*31 + i*7 + 11);
  return '<div class="opts">' + st.order.map(j => {
    const o = Q.options[j], on = st.chosen.includes(j);
    let c = on ? 'sel' : '';
    if (st.done) { if (o.ok && on) c = 'right'; else if (o.ok && !on) c = 'missed'; else if (!o.ok && on) c = 'wrong'; }
    return `<button class="opt ${c}" ${st.done?'disabled':''} onclick="toggleMulti(${j})"><span class="box2"></span>${o.t}</button>`;
  }).join('') + '</div>';
}
function toggleMulti(j){ const st = S(APP.level,APP.q); if (st.done) return; const k = st.chosen.indexOf(j); if (k>=0) st.chosen.splice(k,1); else st.chosen.push(j); renderScreen(); }
function verifyMulti(l,i,Q,st){
  if (!st.chosen.length) { st.fb = '☝️ Coche au moins une proposition.'; st.fbc='info'; return; }
  const ok = Q.options.every((o,j) => o.ok === st.chosen.includes(j));
  if (ok) { finishSimple(l,i, st.att===0?'correct':'hint', st.att===0?Q.pts:Q.pts/2); st.fb = (st.att===0?'✅ Parfait ! ':'✅ Corrigé au 2e essai. ') + Q.expl; st.fbc = st.att===0?'good':'mid'; }
  else {
    st.att++;
    if (st.att === 1) { st.fb = '🤔 Ta sélection n\'est pas encore exacte (il peut manquer des biens ou en avoir de trop). 💡 ' + Q.hint; st.fbc='info'; wrongFx(); }
    else { finishSimple(l,i,'shown',0); st.fb = '👁 Correction : en vert les bons choix, en pointillés ceux qui manquaient, en rouge les intrus. ' + Q.expl; st.fbc='bad'; wrongFx(); }
  }
}

/* Champs numériques et tableaux */
function inputHTML(Q,st,k){
  const inp = Q.inputs[k], lk = st.lock[k], v = st.vals[k] !== undefined ? st.vals[k] : '';
  if (lk) return `<span class="lk ${lk}">${lk==='ko' ? `<s>${esc(v)||'—'}</s> → <b>${fmtAns(inp)}</b>` : fmtAns(inp)}</span>`;
  const unit = (inp.u==='€'||inp.u==='%') ? `<em>${inp.u}</em>` : '';
  return `<span class="inwrap"><input data-k="${k}" value="${esc(v)}" inputmode="decimal" autocomplete="off" aria-label="${esc(inp.l)}" oninput="onFieldInput(this)" onkeydown="if(event.key==='Enter')verify()">${unit}</span>`;
}
function rFields(Q,st){
  let h = '';
  if (Q.head && Q.head.length) h += '<div class="fgrid">' + Q.head.map((f,k) => `<label class="fld"><span>${f.l}</span>${inputHTML(Q,st,k)}</label>`).join('') + '</div>';
  if (Q.table) {
    h += '<div class="tablewrap"><table class="amt"><tr>' + Q.table.cols.map(c => `<th>${c}</th>`).join('') + '</tr>';
    Q.table.rows.forEach(r => { h += '<tr>' + r.map((c,j) => j===0 ? `<td class="yr">${c}</td>` : (typeof c === 'object' ? `<td>${inputHTML(Q,st,c.k)}</td>` : `<td class="given">${c}</td>`)).join('') + '</tr>'; });
    h += '</table></div><div class="muted" style="font-size:.8rem">Montants en euros. Tu peux taper 25000, 25 000 ou 25000,00.</div>';
  }
  h += '<div class="calcprev" id="calcprev"></div>';
  return h;
}
function onFieldInput(el){
  const st = S(APP.level,APP.q); st.vals[el.dataset.k] = el.value;
  const r = evalExpr(el.value), p = document.getElementById('calcprev');
  if (p) p.textContent = r !== null ? '🧮 ' + el.value.replace(/\*/g,'×').replace(/\//g,'÷') + '  →  = ' + fmtN(Math.round(r*100)/100) : '';
}
function okNum(inp, v){ const x = parseNum(v); return !isNaN(x) && Math.abs(x - inp.a) <= (inp.tol !== undefined ? inp.tol : 0.02); }
function verifyFields(l,i,Q,st){
  const open = Q.inputs.map((_,k) => k).filter(k => !st.lock[k]);
  if (open.some(k => st.vals[k] === undefined || String(st.vals[k]).trim() === '')) { st.fb = '☝️ Complète toutes les cases avant de vérifier.'; st.fbc='info'; return; }
  const trapMsgs = [];
  open.forEach(k => {
    const good = okNum(Q.inputs[k], st.vals[k]);
    if (st.att === 0) { if (good) st.lock[k] = 'ok'; }
    else st.lock[k] = good ? 'ok2' : 'ko';
    if (!good && Q.traps) Q.traps.forEach(t => { if (t.k === k && Math.abs(parseNum(st.vals[k]) - t.v) < 0.5) trapMsgs.push(t.m); });
  });
  itemsAfterCheck(l,i,Q,st, Q.inputs.length, trapMsgs, 'cases justes (verrouillées en vert). Corrige les autres.');
}

/* Classement par zones (clic-clic) */
function rClassement(Q,st,l,i){
  if (!st.order) st.order = shuffled(Q.items.length, l*31 + i*7 + 11);
  const tag = j => { const lk = st.lock[j];
    if (lk) return `<span class="tag ${lk}">${Q.items[j].t}${lk==='ko'?`<span class="fix">→ ${Q.zones[Q.items[j].z]}</span>`:''}</span>`;

/* Texte à trous */
function rTrous(Q,st,l,i){

function itemsAfterCheck(l,i,Q,st, n, trapMsgs, okText){
  const nOk = Object.values(st.lock).filter(v => v==='ok'||v==='ok2').length;
  if (st.att === 0 && nOk < n) {
    st.att = 1;
    st.fb = `🔎 ${nOk} / ${n} ${okText} 💡 ${Q.hint}` + (trapMsgs.length ? '<br>🧐 ' + [...new Set(trapMsgs)].join('<br>🧐 ') : '');
    st.fbc = 'info'; wrongFx(); return;
  }
  st.att++;
  itemFinish(l,i,Q,st, n, trapMsgs.length && nOk < n ? '<br>🧐 ' + [...new Set(trapMsgs)].join('<br>🧐 ') : '', ELEMENT_PTS);

/* Barème par élément + statut (factorisé pour tous les exercices à éléments) */
function itemFinish(l,i,Q,st, n, extra, per){
  const locks = Object.values(st.lock);
  const ok = locks.filter(v => v==='ok').length, ok2 = locks.filter(v => v==='ok2').length;
  let earned = ok*per + ok2*per/2 - (st.penalty||0);
  earned = Math.max(0, earned);
  const status = ok === n ? 'correct' : (ok + ok2 === n ? 'hint' : 'shown');
  finishSimple(l,i,status,earned);
  if (status === 'correct') { st.fb = '✅ Tout est juste du premier coup ! ' + Q.expl + (extra||''); st.fbc = 'good'; }
  else if (status === 'hint') { st.fb = '✅ Tout est juste après correction (moitié des points pour les éléments corrigés). ' + Q.expl + (extra||''); st.fbc = 'mid'; }

function bilanIndicateurs(){

    a.max += q.pts; a.pts += (APP.qs[l+'_'+i] && APP.qs[l+'_'+i].earned) || 0;

  const statut = r => r >= .8 ? 'atteint' : r >= .5 ? 'encours' : 'nonatteint';
  return CRITERES.map(c => {
    const inds = c.indicateurs.map(ind => { const a = acc[ind.id] || {pts:0,max:0}; const r = a.max ? a.pts/a.max : 0; return Object.assign({}, ind, {ratio:r, statut:statut(r)}); });

    <div class="sim">
      <label>Valeur d'origine : <b id="simV">20 000 €</b><input type="range" min="1000" max="60000" step="500" value="20000" oninput="simUpdate()" id="simVR"></label>
      <label>Durée : <b id="simN">5 ans</b><input type="range" min="2" max="10" step="1" value="5" oninput="simUpdate()" id="simNR"></label>
    </div>
    <div id="simOut" style="margin-top:12px"></div>
  </div>`;
}
function simUpdate(){
  const vr = document.getElementById('simVR'); if (!vr) return;
  const V = +vr.value, N = +document.getElementById('simNR').value, a = V/N;
  document.getElementById('simV').textContent = fmtE(V) + ' €'; document.getElementById('simN').textContent = N + ' ans';
  let bars = ''; for (let y = 0; y <= N; y++) { const vcn = V - a*y; bars += `<div title="fin année ${y}: ${fmtE(vcn)} €" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px"><div style="width:100%;height:${Math.max(2,vcn/V*110)}px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:5px"></div><small class="muted">${y===0?'achat':y}</small></div>`; }
  document.getElementById('simOut').innerHTML = `<p>Taux = 100 / ${N} = <b>${fmtN(Math.round(10000/N)/100)} %</b> · Annuité = <b>${fmtE(a)} €</b></p><div style="display:flex;gap:6px;height:140px;align-items:flex-end;margin-top:8px">${bars}</div><p class="muted" style="font-size:.8rem;text-align:center">VCN en fin d'année</p>`;
}

function restartGame(){
  TRACKING.sessionId = new Date().toISOString();
  resetProgression();
  APP.globalTimerStart = Date.now();
  setScreen('hub');
}
function resetProgression(){
  APP.qs = {}; APP.score = 0; APP.streak = 0; APP.bestStreak = 0; APP.completed = new Set(); APP.pred = {}; APP.badges = new Set();
  APP.rankIdx = 0; APP.finalCelebrated = false; APP.exerciseTimes = {}; APP.exerciseScores = {}; APP.scoreBeforeExercise = 0; APP.exerciseStartTime = null; APP.timerLevel = null;
  FXQ.length = 0; fxBusy = false; document.getElementById('fxModal').innerHTML = ''; document.getElementById('toast').classList.remove('show');
  renderScreen();
}

/* =====================================================================
   6. EFFETS : particules, XP flottant, combo, confettis, sons, badges, rangs
   ===================================================================== */
let lastPt = { x: innerWidth/2, y: innerHeight/2 };
document.addEventListener('pointerdown', e => { lastPt = { x:e.clientX, y:e.clientY }; }, true);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function goodFx(earned, first){
  tone(660,0,.1); tone(990,.1,.14);
  if (reduced) return;
  const cols = ['#22d68a','#3fc8ff','#ffd166','#8b7bff','#ff8a3d'];
  for (let k = 0; k < 16; k++) {
    const p = document.createElement('div'); p.className = 'particle'; p.style.background = cols[k%cols.length];
    p.style.left = lastPt.x+'px'; p.style.top = lastPt.y+'px'; document.body.appendChild(p);
    const ang = Math.random()*Math.PI*2, d = 40 + Math.random()*70;
    p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px)`,opacity:0}],{duration:800,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish = () => p.remove();
  }
  const f = document.createElement('div'); f.className = 'floatxp'; f.textContent = '+' + fmtXP(earned) + ' XP';
  f.style.left = (lastPt.x-30)+'px'; f.style.top = (lastPt.y-30)+'px'; document.body.appendChild(f); setTimeout(() => f.remove(), 1200);
  if (first && APP.streak >= 3) {
    const c = document.createElement('div'); c.className = 'combo';
    c.textContent = APP.streak >= 10 ? '⚡ INARRÊTABLE ×'+APP.streak : APP.streak >= 5 ? '🔥 EN FEU ×'+APP.streak : '🔥 COMBO ×'+APP.streak;
    document.body.appendChild(c); setTimeout(() => c.remove(), 1300);
  }
}
function wrongFx(){ APP.fxPending = 'shake'; tone(220,0,.18,'sawtooth',.04); }
function confetti(){
  if (reduced) return;
  const cols = ['#22d68a','#3fc8ff','#ffd166','#8b7bff','#ff8a3d','#ff4d6d'];
  for (let k = 0; k < 90; k++) {
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100+'vw'; c.style.background = cols[k%cols.length];
    c.style.animationDuration = (2.2 + Math.random()*2)+'s'; c.style.animationDelay = (Math.random()*.6)+'s';
    document.body.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
/* Sons Web Audio (coupés par défaut) */
let actx = null;
function tone(freq, start, dur, type, vol){
  if (!APP.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function toggleSound(){ APP.sound = !APP.sound; document.getElementById('soundBtn').textContent = APP.sound ? '🔊' : '🔇'; if (APP.sound) tone(784,0,.1); }

/* File d'attente : un seul effet spectaculaire à la fois */
const FXQ = []; let fxBusy = false;
function queueFx(item){ FXQ.push(item); runFx(); }
function runFx(){
  if (fxBusy || !FXQ.length) return;
  fxBusy = true; const it = FXQ.shift();
  if (it.type === 'badge') {
    const b = BADGES.find(x => x.id === it.id);
    document.getElementById('toastIcon').textContent = b.ic; document.getElementById('toastTitle').textContent = 'Badge débloqué : ' + b.n; document.getElementById('toastText').textContent = b.c;
    const t = document.getElementById('toast'); t.classList.add('show'); tone(784,0,.12); tone(988,.12,.12); tone(1319,.24,.2);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => { fxBusy = false; runFx(); }, 450); }, 3000);
  } else if (it.type === 'rank') {
    const R = RANKS[it.r];
    document.getElementById('fxModal').innerHTML = `<div class="overlay rankup" onclick="if(event.target===this)closeRank()"><div class="rays"></div><div class="modal">
      <span class="ri">${R.ic}</span><div class="qtag">Promotion !</div><h2 style="margin:6px 0">Tu deviens ${R.n}</h2>
      <p class="muted">Tu as atteint ${fmtXP(it.score)} XP. Continue : ${RANKS[it.r+1] ? 'prochain rang à '+Math.ceil(RANKS[it.r+1].p*TOTAL_XP)+' XP.' : 'tu as atteint le sommet !'}</p>
      <button class="btn" style="margin-top:16px" onclick="closeRank()">Continuer ➜</button></div></div>`;
    confetti(); tone(523,0,.12); tone(659,.12,.12); tone(784,.24,.12); tone(1047,.36,.3);
  }
}
function closeRank(){ document.getElementById('fxModal').innerHTML = ''; fxBusy = false; runFx(); }
function award(id){ if (APP.badges.has(id)) return; APP.badges.add(id); queueFx({type:'badge', id}); }
function checkRank(before){
  const r0 = rankOf(before), r1 = rankOf(APP.score);
  if (r1 > r0 && r1 > APP.rankIdx) { APP.rankIdx = r1; queueFx({type:'rank', r:r1, score:APP.score}); }
}

/* =====================================================================
   7. TRACKING (SPEC_Tracking_Eleves_v5)
   ===================================================================== */
const TRACKING = {
  appName: "Les amortissements — Partie 1",
  totalNiveaux: LEVELS.length,
  sessionId: null,
  scriptUrl: "https://script.google.com/macros/s/AKfycbx9bRMVuHU2mgFLii1KcQXD3LdZahnDH1rf1cWv9RuDvQAt0l3VtLtxzmbH7MtpJWRjfA/exec"
};
function showEmailModal() {
  const overlay = document.getElementById('emailOverlay');
  overlay.style.display = 'flex';
  const input = document.getElementById('emailInput');
  const saved = lsGet('student_email');
  if (saved) input.value = saved;
  input.focus();
  document.getElementById('emailError').textContent = '';
}
function validateEmail() {
  const input = document.getElementById('emailInput');
  const btn = document.getElementById('emailBtn');
  const errDiv = document.getElementById('emailError');
  const email = input.value.trim().toLowerCase();
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    errDiv.textContent = '⚠️ Entre une adresse email valide.'; input.style.borderColor = '#ff4060'; return;
  }
  btn.textContent = '⏳ Vérification…'; btn.disabled = true; errDiv.textContent = ''; input.style.borderColor = '';
  const cbName = '_emailCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    errDiv.textContent = '⚠️ Connexion impossible. Vérifie ta connexion internet.';
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
  }, 10000);
  window[cbName] = function(resp) {
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false;
    if (resp && resp.found) {
      const oldEmail = lsGet('student_email');
      lsSet('student_email', email);
      lsSet('student_classe', resp.classe || '');
      APP.email = email; APP.classe = resp.classe || '';
      if (oldEmail && oldEmail !== email) resetProgression();
      TRACKING.sessionId = new Date().toISOString();
      document.getElementById('emailOverlay').style.display = 'none';
      startGlobalTimer();
      renderScreen();
    } else {
      errDiv.textContent = "⚠️ Cette adresse email n'est pas enregistrée. Vérifie l'orthographe ou demande à ton professeur de t'ajouter à la liste.";
      input.style.borderColor = '#ff4060';
    }
  };
  const s = document.createElement('script');
  s.id = cbName;
  s.src = `${TRACKING.scriptUrl}?action=check_email&email=${encodeURIComponent(email)}&callback=${cbName}`;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); errDiv.textContent = '⚠️ Erreur de connexion au serveur.'; btn.textContent = '✅ Vérifier et commencer'; btn.disabled = false; };
  document.body.appendChild(s);
}
function startGlobalTimer() {
  APP.globalTimerStart = Date.now();
  const el = document.getElementById('globalTimer'); if (el) el.style.display = 'inline-flex';
  clearInterval(APP.globalTimerInterval);
  APP.globalTimerInterval = setInterval(updateTimerDisplay, 1000); updateTimerDisplay();
}
function updateTimerDisplay() {
  const el = document.getElementById('globalTimer'); if (!el || !APP.globalTimerStart) return;
  const elapsed = Math.floor((Date.now() - APP.globalTimerStart) / 1000);
  el.textContent = '⏱️ ' + String(Math.floor(elapsed/60)).padStart(2,'0') + ':' + String(elapsed%60).padStart(2,'0');
}
function startExerciseTimer(exIdx) { APP.exerciseStartTime = Date.now(); APP.scoreBeforeExercise = APP.score || 0; }
function stopExerciseTimer(exIdx) {
  if (!APP.exerciseStartTime) return null;
  const tempsSec = Math.round((Date.now() - APP.exerciseStartTime) / 1000);
  APP.exerciseTimes[exIdx] = tempsSec; APP.exerciseStartTime = null;
  const deltaPoints = (APP.score || 0) - APP.scoreBeforeExercise;
  APP.exerciseScores[exIdx] = deltaPoints;
  return { points: deltaPoints, temps: tempsSec };
}
function sendResult(niveau, points, pointsMax, temps) {
  if (!APP.email) return;
  const payload = { email: APP.email, classe: APP.classe, app: TRACKING.appName, niveau: niveau, points: points, pointsMax: pointsMax, temps: temps, totalNiveaux: TRACKING.totalNiveaux, sessionId: TRACKING.sessionId };
  console.log('[TRACKING] Envoi:', payload);
  fetch(TRACKING.scriptUrl, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify(payload) })
    .catch(err => console.warn('[TRACKING] Erreur:', err));
}
let currentLBTab = 'app';
function openLB(tab) { document.getElementById('lbOverlay').style.display = 'block'; switchLBTab(tab || 'app'); }
function closeLB() { document.getElementById('lbOverlay').style.display = 'none'; }
function switchLBTab(tab) {
  currentLBTab = tab;
  const btnApp = document.getElementById('lbTabApp'), btnGlobal = document.getElementById('lbTabGlobal');
  const cl = APP.classe ? ' (' + APP.classe + ')' : '';
  document.getElementById('lbTitle').textContent = tab === 'app' ? '🏆 Classement — ' + TRACKING.appName + cl : '🌍 Classement général' + cl;
  if (tab === 'app') { btnApp.style.background = 'var(--accent)'; btnApp.style.color = '#0f1117'; btnGlobal.style.background = 'transparent'; btnGlobal.style.color = 'var(--orange)'; }
  else { btnGlobal.style.background = 'var(--orange)'; btnGlobal.style.color = '#0f1117'; btnApp.style.background = 'transparent'; btnApp.style.color = 'var(--accent)'; }
  fetchLeaderboard(tab);
}
function fetchLeaderboard(tab) {
  const content = document.getElementById('lbContent');
  content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">⏳ Chargement…</div>';
  const action = tab === 'app' ? 'leaderboard_app' : 'leaderboard_global';
  const cbName = '_lbCb_' + Date.now();
  const timeout = setTimeout(() => {
    delete window[cbName]; const s = document.getElementById(cbName); if (s) s.remove();
    content.innerHTML = '<div style="text-align:center;padding:40px;"><div style="color:#ff4060;margin-bottom:12px;">⚠️ Connexion impossible</div><button onclick="fetchLeaderboard(\''+tab+'\')" style="padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);cursor:pointer;font-family:inherit;">Réessayer</button></div>';
  }, 10000);
  window[cbName] = function(resp) {
    clearTimeout(timeout); delete window[cbName];
    const s = document.getElementById(cbName); if (s) s.remove();
    const lbData = resp && (resp.leaderboard || resp.data);
    if (!lbData || lbData.length === 0) { content.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text2);">🏁 Aucun résultat pour le moment</div>'; return; }
    renderLeaderboard(lbData, tab);
  };
  let url = `${TRACKING.scriptUrl}?action=${action}&callback=${cbName}&mode=last`;
  if (tab === 'app') url += `&app=${encodeURIComponent(TRACKING.appName)}`;
  if (APP.classe) url += `&classe=${encodeURIComponent(APP.classe)}`;
  const s = document.createElement('script'); s.id = cbName; s.src = url;
  s.onerror = () => { clearTimeout(timeout); delete window[cbName]; s.remove(); content.innerHTML = '<div style="text-align:center;padding:40px;color:#ff4060;">⚠️ Erreur de connexion</div>'; };
  document.body.appendChild(s);
}
function renderLeaderboard(data, tab) {
  const content = document.getElementById('lbContent');
  const myEmail = (APP.email || '').toLowerCase();
  if (tab === 'global' && data.length > 0) {
    data = data.slice().sort((a, b) => { const pa = (a.pct != null ? a.pct : (a.pourcentage || 0)), pb = (b.pct != null ? b.pct : (b.pourcentage || 0)); if (pb !== pa) return pb - pa; return (a.totalTemps || a.totalTime || 0) - (b.totalTemps || b.totalTime || 0); });
    data.forEach((entry, i) => { entry.rang = i + 1; });
  }
  const me = data.find(r => (r.email || '').toLowerCase() === myEmail);
  let html = '';
  if (me) {
    const pct = me.pct != null ? me.pct : (me.pourcentage != null ? me.pourcentage : 0);
    const count = tab === 'app' ? (me.niveauxCompletes || me.niveaux || 0) : (me.appsCompletes || me.apps || 0);
    const total = tab === 'app' ? (me.totalNiveaux || 0) : (me.totalPossibleNiveaux || 0);
    const label = tab === 'app' ? 'niveaux' : 'apps';
    const prog = total > 0 ? count + '/' + total + ' ' + label : count + ' ' + label;
    html += `<div style="background:rgba(34,214,138,0.08);border:1px solid rgba(34,214,138,0.3);border-radius:12px;padding:16px;margin-bottom:16px;display:flex;justify-content:space-around;text-align:center;gap:8px;flex-wrap:wrap;">
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--accent);">#${me.rang}</div><div style="font-size:0.7rem;color:var(--text2);">RANG</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;">${me.totalPoints}</div><div style="font-size:0.7rem;color:var(--text2);">POINTS</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:${pct>=80?'#22d68a':pct>=50?'#ff8a3d':'#ff4060'};">${pct}%</div><div style="font-size:0.7rem;color:var(--text2);">RÉUSSITE</div></div>
      <div><div style="font-size:1.3rem;font-weight:800;color:var(--text2);">${prog}</div><div style="font-size:0.7rem;color:var(--text2);">PROGRESSION</div></div></div>`;
  }
  const medals = ['🥇','🥈','🥉'];
  html += '<table><tr style="border-bottom:1px solid var(--border);"><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:0.72rem;">#</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Élève</th><th style="text-align:left;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Progression</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Pts</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:0.72rem;">%</th><th style="text-align:right;padding:8px 4px;color:var(--text2);font-size:0.72rem;">Temps</th></tr>';
  data.forEach(row => {
    const r = row.rang || 0;
    const name = (row.email || '').split('@')[0].split(/[._-]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
    const pct = row.pct != null ? row.pct : (row.pourcentage != null ? row.pourcentage : 0);
    const temps = row.totalTemps || row.totalTime || 0;
    const count = tab === 'app' ? (row.niveauxCompletes || row.niveaux || 0) : (row.appsCompletes || row.apps || 0);
    const total = tab === 'app' ? (row.totalNiveaux || 0) : (row.totalPossibleNiveaux || 0);
    const w = total > 0 ? Math.min(100, Math.round(count / total * 100)) : 0;
    const isMe = (row.email || '').toLowerCase() === myEmail;
    const pctC = pct >= 80 ? '#22d68a' : pct >= 50 ? '#ff8a3d' : '#ff4060';
    let tStr = '—'; if (temps > 0) { const m = Math.floor(temps/60), s = temps % 60; tStr = m > 0 ? m + 'm' + String(s).padStart(2,'0') + 's' : s + 's'; }
    html += `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);background:${isMe?'rgba(34,214,138,0.08)':'transparent'};"><td style="padding:8px 4px;font-weight:700;">${r<=3?medals[r-1]:r}</td><td style="padding:8px 4px;${isMe?'font-weight:800;color:var(--accent);':''}">${esc(name)}</td><td style="padding:8px 4px;"><div style="background:var(--bg3);border-radius:99px;height:6px;width:70px;overflow:hidden"><div style="height:100%;width:${w}%;background:var(--accent)"></div></div><span style="font-size:.7rem;color:var(--text2)">${count}/${total||'?'}</span></td><td style="padding:8px 4px;text-align:right;font-weight:700;color:var(--accent);">${row.totalPoints}</td><td style="padding:8px 4px;text-align:right;font-weight:700;color:${pctC};">${pct}%</td><td style="padding:8px 4px;text-align:right;color:var(--text2);font-family:monospace;font-size:0.78rem;">${tStr}</td></tr>`;
  });
  html += '</table>';
  content.innerHTML = html;
}

/* =====================================================================
   8. DÉMARRAGE
   ===================================================================== */
function init(){
  renderScreen();
  showEmailModal();   // toujours, même si un email est mémorisé
}
init();
</script>
